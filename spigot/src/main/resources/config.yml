# MultiAuth Spigot 配置文件

# 语言设置
# 插件启动时会生成 lang/ 文件夹，内含多种语言文件
# 修改此项后执行 /multiauth reload 即可生效
# 支持: zh_cn (简体中文), en_gb (英语)
language: zh_cn

# 调试模式
debug: false

# 玩家进服后是否在消息栏显示登录状态（正版/离线 + UUID）
# true  = 玩家加入服务器后在消息栏收到登录状态通知
# false = 玩家不接收该通知（生产日志仍会记录每个玩家的登录状态，不受此开关影响）
notify-player-status: true

# 代理模式
# true  = 信任 Velocity 代理端的验证结果（Velocity 端必须安装 MultiAuth 插件完成验证）
#         Velocity 的 velocity.toml 必须设置 online-mode = true
#         Spigot 仅校验 Velocity 转发的 UUID 是否与数据库记录一致
#         ⚠ 强烈建议 Velocity 与 Spigot 共用同一数据库（MySQL 或相同路径的 SQLite）
#           如数据库未共享，Spigot 会自动同步记录，但无法检测跨端的正版记录冲突
# false = Spigot 端自行执行完整 Mojang 验证流程（Velocity 端无需安装任何插件）
#         此模式要求 server.properties 中 online-mode=false
proxy: false

# 是否使用 Mojang 正版 UUID（proxy=false 时生效,代理模式下由 Velocity 传入UUID）
# true  = 验证通过后使用正版 UUID
# false = 始终使用离线 UUID（基于玩家名生成）
use-mojang-uuid: true

# 跨服会话同步签名密钥（proxy=true 时生效，强烈建议配置）
# Velocity 与 Spigot 端必须配置相同的密钥字符串
# 留空 = 不验签（仅拦截经代理转发的伪造消息，后端直连场景不安全）
session-sync-secret: "change this to you own secret string."

# 认证列表（proxy=false 时生效，玩家名列表，不区分大小写）
# 即使 Mojang API 查得用户名非正版，若在此列表中仍强制要求完成 Mojang 加密验证
auth-list: []

# Mojang API 配置（proxy=false 时生效）
mojang-api:
  # 注意！该API仅用于检测玩家游戏名情况，不用于正版验证；仅防止离线玩家无法进入服务器.
  # 备用 API 地址列表（官方 API 宕机时依次尝试，留空则不启用备用）
  # 占位符 {username} 会被替换为玩家名
  # 当所有 API 均不可用时，会拒绝所有玩家登录（日志中会有详细提示）
  # 官方 Mojang API: https://api.mojang.com/users/profiles/minecraft/{username}
  # 常见备用 API:
  #   - "https://api.minetools.eu/uuid/{username}"
  fallback-urls:
    # - "https://api.minetools.eu/uuid/{username}"

  # 每个用户名每秒最多向 Mojang API 发起的请求数（0=不限制）
  # 防止同一用户名反复重连/脚本循环触发 Mojang 429.
  request-limit: 2

# 数据库配置（proxy=true / false 均需配置，与 Velocity 端共享同一数据库）
database:
  # 数据库类型: sqlite 或 mysql
  type: sqlite

  # SQLite 配置（type = sqlite 时生效）
  sqlite-file: multiauth.db

  # MySQL 配置（type = mysql 时生效）
  mysql-host: localhost
  mysql-port: 3306
  mysql-database: multiauth
  mysql-username: root
  mysql-password: ""
  mysql-table-prefix: multiauth_
  # 是否使用 SSL 连接 MySQL 数据库（建议生产环境开启）
  mysql-use-ssl: false

  # 心跳间隔（秒），定期检查数据库连接是否存活
  heartbeat-interval: 60

# 备份配置
backup:
  # 是否启用定时备份
  enabled: true
  # 备份间隔（小时）
  interval-hours: 24
  # 备份文件存放目录（相对于插件数据目录）
  dir: backups
  # 最大备份数量，超出后自动清理最旧的
  max-count: 7

# 离线玩家注册登录配置
# 仅对离线玩家（非正版）生效，正版玩家不受限制
auth:
  # 是否启用离线玩家注册登录
  enabled: true
  # 密码最小长度
  password-min-length: 4
  # 密码最大长度
  password-max-length: 32
  # 未登录玩家是否强制冒险模式（防止破坏方块）
  force-adventure: false
  # 未登录玩家是否固定位置（禁止移动）
  freeze-position: true
  # 未登录玩家限制项开关（可单独开关各项限制）
  restrict-move: true        # 禁止移动
  restrict-chat: true        # 禁止聊天
  restrict-interact: true    # 禁止交互（方块/实体/物品）
  restrict-damage: true      # 免疫伤害且不能造成伤害
  restrict-command: true     # 禁止使用除 allow-commands 以外的命令
  # 未登录玩家允许执行的命令列表（不区分大小写）
  # 默认允许注册和登录命令及其别名
  allow-commands:
    - register
    - login
    - reg
    - l
  # 登录超时时间（秒），超时未登录则踢出玩家
  # 设置 <=0 可禁用超时限制
  login-timeout: 600
  # 注册超时时间（秒），超时未注册则踢出玩家
  register-timeout: 180
  # 未登录玩家进服时是否传送到出生点
  # enable: 是否启用出生点传送
  # world: 留空则使用玩家当前世界出生点；填写世界名（支持 Multiverse 世界）则传送到指定坐标
  #        若配置的世界不存在（且 Multiverse 无法加载），则回退到当前世界出生点
  login-spawn-point:
    enable: false
    world: ""
    x: 0.0
    y: 64.0
    z: 0.0
    yaw: 0.0
    pitch: 0.0
  # 登录成功后是否回到上次下线地点
  # 正版玩家：启用后直接传送到上次下线位置（不会被传送到出生点）
  # 离线玩家：登录/注册成功后传送到上次下线位置
  return-last-location: false
  # 登录后是否强制生存模式（覆盖原始游戏模式）
  force-survival: false

  # ==================== 安全增强 ====================
  security:
    # 失败计数与冷却
    failed-login:
      enabled: true
      # 账户级别：保护单个账户不被暴力破解
      account:
        max-attempts: 5            # 最大失败次数，达到后进入冷却（0=不限制）
        cooldown: 300              # 冷却时间（秒），冷却期内拒绝登录
        reset-on-success: true     # 登录成功后重置计数
      # IP 级别：防止同一 IP 对多账户批量尝试
      ip:
        max-attempts: 10           # 单 IP 跨账户最大失败次数（0=不限制）
        cooldown: 600              # IP 封禁冷却时间（秒）
        reset-on-success: false    # IP 级别不随单次成功重置

    # 单 IP 账号数量限制
    ip-limits:
      enabled: true
      max-accounts-per-ip: 3        # 单 IP 最多注册账号数（0=不限制）
      max-online-per-ip: 2         # 单 IP 最多同时在线账号数（0=不限制）

    # IP 变更警告
    ip-change:
      enabled: true
      warn-player: false            # 向玩家发送 IP 变更警告
      notify-admin: true            # 通知在线管理员（有 multiauth.admin 权限）

    # IP 地理位置检测（ip2region 离线查询）
    geo-detection:
      enabled: false                # 默认关闭（启用后首次自动下载 xdb 文件）
      xdb-dir: "ip2region"          # xdb 文件存放目录（相对插件数据目录）
      auto-download: true            # 文件不存在时自动从 GitHub 下载
      v4:
        enabled: true               # 默认启用 IPv4 查询
        file: "ip2region_v4.xdb"    # 本地文件名（~10MB）
      v6:
        enabled: false               # 默认关闭 IPv6 查询
        file: "ip2region_v6.xdb"    # 本地文件名（~70MB）
      cache-policy: "vIndexCache"    # 缓存策略: file / vIndexCache / bufferCache
      searchers: 15                 # 查询线程池大小
      cross-country:
        action: warn                # warn=警告 | kick=踢出 | require-login=阻止会话恢复（仅影响重连免密恢复，正常登录时等同 warn）
      cross-city:
        action: warn                # warn=警告 | kick=踢出 | require-login=阻止会话恢复（仅影响重连免密恢复，正常登录时等同 warn）
      skip-lan: true                # 局域网 IP 跳过地理检测

    # 登录历史记录
    login-history:
      enabled: true
      max-records-per-player: 20    # 每玩家保留历史记录条数，超出删旧

# 会话配置
session:
  # 会话超时时间（分钟），0=禁用
  # 启用后，玩家登录成功后在超时时间内退出并重新进入无需再次登录
  # 前提：前后两次登录 IP 相同
  timeout: 0
